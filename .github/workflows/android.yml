
name: Build EBAN PLASTIC APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          mkdir project
          unzip -q EBAN_PLASTIC_Bilingual_Android_Project.zip -d project
          find project -name gradlew -type f

      - name: Build APK
        run: |
          GRADLE_FILE=$(find project -name gradlew -type f | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "Gradle wrapper not found"
            exit 1
          fi
          chmod +x "$GRADLE_FILE"
          cd "$(dirname "$GRADLE_FILE")"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EBAN-PLASTIC-APK
          path: project/**/build/outputs/apk/debug/*.apk
